[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dude-transfer"
version = "0.1.0"
description = "Adaptive, observable bulk transfers from Databricks to Amazon S3"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []
keywords = ["databricks", "s3", "spark", "multipart", "data-transfer"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Distributed Computing",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35.20"]
dev = ["boto3>=1.35.20", "pytest>=8", "ruff>=0.9"]

[project.scripts]
dude = "dude_transfer.cli:main"

[project.urls]
Homepage = "https://github.com/sir-gig/dude-transfer"
Documentation = "https://github.com/sir-gig/dude-transfer#readme"
Issues = "https://github.com/sir-gig/dude-transfer/issues"
Source = "https://github.com/sir-gig/dude-transfer"
Changelog = "https://github.com/sir-gig/dude-transfer/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/dude_transfer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: opt-in tests that create data in a disposable S3 prefix"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/databricks_s3.py" = ["F821"]
"benchmarks/databricks_single_jsonl.py" = ["F821"]
