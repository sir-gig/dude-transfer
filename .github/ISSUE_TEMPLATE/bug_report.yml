name: Bug report
description: Report reproducible incorrect behavior
title: "[bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, sensitive paths, patient data, or production data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dude version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, Databricks runtime/access mode, AWS regions, and file format.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic data and redact bucket/account details.
    validations:
      required: true
