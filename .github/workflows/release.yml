name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python scripts/check_release_version.py "${GITHUB_REF_NAME}"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Create immutable GitHub release
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
